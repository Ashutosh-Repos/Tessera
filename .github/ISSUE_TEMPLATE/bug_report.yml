name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Tessera
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant context as possible.
  - type: input
    id: version
    attributes:
      label: Tessera Version / Commit Hash
      description: What version or git commit of Tessera are you running?
      placeholder: e.g. v1.0.0 or commit 84a02af
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Tier / Component
      options:
        - API Gateway
        - Coordinator (Slicer / Ring / State)
        - Worker (Transcoder / PTS Prober)
        - UI SDK
        - Admin Console
        - Developer Portal
        - Infrastructure (NATS, Redis, MinIO, Etcd, SQS)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Start cluster with `./start.sh`
        2. Submit upload session with `POST /api/jobs/upload-session`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please copy and paste any relevant terminal, daemon, or browser console logs.
      render: shell
